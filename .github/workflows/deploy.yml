# Constrói o portal e publica em docs.segark.com pelo GitHub Pages.
#
# Configuração única (admin do repo), depois do primeiro push:
#   1. Settings › Pages › Build and deployment › Source: "GitHub Actions".
#   2. Settings › Pages › Custom domain: docs.segark.com. Um domínio só pode
#      estar em UM repositório: tire-o antes do Pages do CentralOps (docs-site).
#      O DNS (CNAME docs → segark-oficial.github.io) já existe e não muda.
#   3. Marque "Enforce HTTPS" quando o certificado sair.
#
# Em pull request só constrói: `onBrokenLinks: throw` barra link quebrado
# antes do merge. Em main (e uma vez por dia, para o changelog do CentralOps
# acompanhar as releases) constrói e publica.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sem rede ou com rate limit, o script mantém o changelog do repositório.
      - name: Changelog do CentralOps (GitHub Releases)
        run: npm run sync:changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (pt-BR, en, es)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
